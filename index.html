<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova</title>
<style>
:root{--bg:#05070D;--bg2:#0A0F1E;--card:#101A2E;--line:#1B2A47;--tx:#FFFFFF;--sub:#8A9BBF;--blue:#1A3A6B;--acc:#3B82F6;--bub-me:#1A3A6B;--bub-ot:#121212}
[data-theme=clair]{--bg:#0A0F1E;--bg2:#101A2E;--card:#16243F;--line:#24365A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,16px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.page.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:.6rem;padding:calc(env(safe-area-inset-top) + .8rem) 1rem .9rem;background:var(--bg2);border-radius:0 0 24px 24px;flex-shrink:0}
.hd h2{margin:0;font-size:1.25rem;flex:1;display:flex;align-items:center;gap:.3rem}
.ib{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.ib svg{width:1.4rem;height:1.4rem}
.ib:active{background:rgba(255,255,255,.12)}
.ib.fill{background:var(--blue)}
.scroll{flex:1;overflow:auto;padding:1rem;padding-bottom:6.5rem}
.av{width:2.8rem;height:2.8rem;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.av.big{width:6.5rem;height:6.5rem;font-size:2.4rem}
.av.sm{width:2.3rem;height:2.3rem;font-size:.95rem}
.bdg{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-left:4px;flex-shrink:0}
.item{display:flex;align-items:center;gap:14px;padding:18px 16px;margin-bottom:12px;background:var(--card);border-radius:16px;cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.98)}
.item b{flex:1;font-weight:600}
.item svg{width:24px;height:24px;flex-shrink:0}
.item .ch svg{width:20px;height:20px;color:var(--sub)}
.btn{display:block;width:100%;padding:1rem;border-radius:18px;background:var(--blue);color:#fff;font-weight:700;text-align:center;margin-top:.8rem}
.btn.red{background:#7F1D1D}.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.7}
.field{width:100%;padding:1rem 1.1rem;border-radius:18px;border:1px solid var(--line);background:var(--card);outline:none}
.field:focus{border-color:var(--acc)}
.spin{display:inline-block;width:1.3rem;height:1.3rem;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
.sub{color:var(--sub);font-size:.85rem}
.err{color:#F87171;min-height:1.2rem;font-size:.9rem;text-align:center;margin-top:.5rem}
#splash{background:#05070D;align-items:center;justify-content:center}
#splash svg{width:7rem;height:7rem;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#inscription .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;gap:1.2rem}
.photo-pick{width:8rem;height:8rem;border-radius:50%;background:var(--card);border:2px dashed var(--blue);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--sub)}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick svg{width:2.4rem;height:2.4rem}
#nav{position:fixed;left:.8rem;right:.8rem;bottom:calc(env(safe-area-inset-bottom) + .6rem);height:4.2rem;background:var(--card);border-radius:30px;display:none;justify-content:space-around;align-items:center;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#nav button{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;position:relative;color:rgba(255,255,255,.6);transition:.2s}
#nav button svg{width:28px;height:28px}
#nav button.act{color:#fff;background:rgba(59,130,246,.35)}
#dot{position:absolute;top:.55rem;right:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--acc);border:2px solid var(--card);display:none}
.conv{display:flex;align-items:center;gap:.8rem;padding:.85rem;margin-bottom:.6rem;background:var(--card);border-radius:20px;cursor:pointer}
.conv .mid{flex:1;min-width:0}
.conv .mid b{display:flex;align-items:center}
.conv .mid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub);font-size:.85rem}
.pt{width:.7rem;height:.7rem;border-radius:50%;background:var(--acc);flex-shrink:0}
#chat{background:var(--bg)}
#msgs{flex:1;overflow:auto;padding:1rem .8rem;display:flex;flex-direction:column;gap:.35rem}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}.row.ot{align-self:flex-start}
.bub{position:relative;padding:.6rem .9rem;border-radius:20px;color:#fff;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;user-select:none;-webkit-user-select:none;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.me .bub{background:var(--bub-me);border-bottom-right-radius:6px}
.ot .bub{background:var(--bub-ot);border-bottom-left-radius:6px}
.bub .meta{font-size:.65rem;opacity:.65;text-align:right;margin-top:.2rem}
.mimg{max-width:100%;border-radius:14px;display:block;margin-bottom:.3rem}
.quote{border-left:3px solid #4B6FA8;background:rgba(255,255,255,.08);padding:.3rem .5rem;border-radius:8px;font-size:.8rem;margin-bottom:.35rem}
.react{position:absolute;bottom:-.85rem;right:.5rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 .3rem;font-size:.85rem}
.row:has(.react){margin-bottom:.7rem}
.st{font-size:.65rem;color:var(--sub);margin:.15rem .4rem 0}
.day{align-self:center;font-size:.7rem;color:var(--sub);background:var(--card);padding:.2rem .7rem;border-radius:12px;margin:.4rem 0}
.dots{display:flex;gap:.25rem;padding:.8rem .9rem!important}
.dots i{width:.5rem;height:.5rem;background:#6B83B0;border-radius:50%;animation:jump 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes jump{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.comp{display:flex;align-items:flex-end;gap:.5rem;padding:.6rem .7rem calc(env(safe-area-inset-bottom) + .6rem);background:var(--bg2);border-radius:24px 24px 0 0;flex-shrink:0}
.comp textarea{flex:1;resize:none;max-height:7rem;border:1px solid var(--line);background:var(--card);border-radius:24px;padding:.7rem 1rem;outline:none;caret-color:var(--acc);height:2.8rem;line-height:1.3}
.comp .ib{height:2.8rem;width:2.8rem}
.comp .send{background:var(--blue)}
.bar{display:none;align-items:center;gap:.6rem;padding:.5rem .9rem;background:var(--bg2);border-left:4px solid var(--blue);font-size:.85rem;color:var(--sub)}
.bar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#dd{position:absolute;top:4.4rem;right:.8rem;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:.5rem;min-width:13.5rem;display:none;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#dd .top{display:flex;gap:.6rem;align-items:center;padding:.6rem;border-bottom:1px solid var(--line);margin-bottom:.3rem;cursor:pointer}
#dd button{display:flex;align-items:center;gap:.7rem;width:100%;padding:.7rem;border-radius:14px;text-align:left}
#dd button:active{background:var(--line)}
#dd svg{width:1.2rem;height:1.2rem;color:var(--sub)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet{width:100%;max-width:30rem;background:var(--bg2);border-radius:28px 28px 0 0;padding:1.2rem 1.2rem calc(env(safe-area-inset-bottom) + 1.2rem);animation:up .25s ease;max-height:85vh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#sheet h3{margin:.2rem 0 .6rem}
.emo{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:.8rem}
.emo button{font-size:1.7rem;padding:.3rem;border-radius:14px}.emo button:active{background:var(--line)}
.act-b{display:block;width:100%;text-align:left;padding:.85rem 1rem;border-radius:16px;background:var(--card);margin-top:.4rem}
.seg{display:flex;gap:.5rem;margin:.6rem 0}
.seg button{flex:1;padding:.8rem;border-radius:16px;background:var(--card);border:1px solid transparent}
.seg button.sel,.lang.sel,.act-b.sel{border-color:var(--acc);background:#16294A}
.lang{display:flex;gap:.8rem;align-items:center;padding:.8rem 1rem;border-radius:16px;background:var(--card);margin-bottom:.45rem;border:1px solid transparent;width:100%;text-align:left}
.lang .fl{font-size:1.5rem}
.lang svg{width:1.2rem;height:1.2rem}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden}
td,th{padding:.7rem;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600;font-size:.8rem}
.ring{padding:3px;border-radius:50%;background:var(--acc)}.ring.seen{background:#3A4458}.ring .av{border:2px solid var(--card)}
.sv{position:fixed;inset:0;background:#000;color:#fff;z-index:60;display:none;flex-direction:column}
.sv .prog{display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + .6rem) .8rem .3rem}
.sv .prog i{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.sv .prog i b{display:block;height:100%;width:0;background:#fff}
.sv .stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
.sv .stage img{max-width:100%;max-height:100%}
.tbg{position:absolute;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;font-size:1.6rem;font-weight:700}
.tbg svg.decor{position:absolute;inset:0;width:100%;height:100%;opacity:.3}
.tbg span,.tbg textarea{position:relative}
.tbg textarea{background:none;border:0;outline:none;color:#fff;text-align:center;font-size:1.6rem;font-weight:700;width:100%;height:60%;resize:none}
.cap{position:absolute;bottom:0;left:0;right:0;padding:1rem;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
.toast{position:fixed;left:50%;bottom:6.8rem;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:#fff;padding:.7rem 1.2rem;border-radius:20px;z-index:99;display:none;max-width:85%;text-align:center;font-size:.9rem}
.upd{background:var(--card);border-radius:20px;padding:1rem;margin-bottom:.8rem}
.upd small{color:var(--sub)}
.acct{background:var(--card);border-radius:22px;padding:1.4rem 1rem;margin-bottom:16px;text-align:center}
.acct .lk{background:var(--bg);border-radius:14px;padding:.7rem;margin-top:.8rem;font-size:.8rem;word-break:break-all;color:var(--sub)}
.acct .btn{margin-top:.7rem;padding:.8rem}
html[dir=rtl] .back svg,html[dir=rtl] .ch svg{transform:scaleX(-1)}
</style>
</head>
<body>
<div id="app">

  <div class="page on" id="splash"><span data-ic="star"></span></div>

  <div class="page" id="inscription">
    <div class="hd"><h2 style="justify-content:center" data-i="signup"></h2></div>
    <div class="body">
      <label class="photo-pick" id="reg-pp"><span data-ic="gallery"></span><input type="file" accept="image/*" id="reg-file" hidden></label>
      <input class="field" id="reg-nom" maxlength="30" data-ip="name_ph" autocomplete="off">
      <div class="err" id="reg-err"></div>
    </div>
    <div style="padding:1rem 1.2rem calc(env(safe-area-inset-bottom) + 1.2rem)"><button class="btn" id="reg-btn" onclick="creerCompte()" data-i="create"></button></div>
  </div>

  <div class="page" id="discussions">
    <div class="hd"><h2 data-i="disc"></h2><button class="ib" onclick="openAjout()" data-ic="plus"></button><button class="ib" onclick="showPage('parametres')" data-ic="gear"></button></div>
    <div class="scroll" id="conv-list"></div>
  </div>

  <div class="page" id="statuts">
    <div class="hd"><button class="ib fill" onclick="$('st-file').click()" data-ic="plus" style="width:2.7rem;height:2.7rem"></button><h2 data-i="stat"></h2><button class="ib" onclick="openStatutTexte()" data-ic="text"></button></div>
    <input type="file" accept="image/*" id="st-file" hidden>
    <div class="scroll"><div id="st-list"></div></div>
  </div>

  <div class="page" id="st-new">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="newstatus"></h2></div>
    <div id="st-prev" style="flex:1;position:relative;overflow:hidden"></div>
    <div class="comp">
      <textarea id="st-cap" rows="1" data-ip="caption"></textarea>
      <button class="ib send" id="st-share" onclick="publierStatut()" data-ic="send"></button>
    </div>
  </div>

  <div class="page" id="nova">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><span class="av sm" style="background:#0A0F1E;padding:.35rem" data-ic="star"></span><h2>Nova <span class="bdg-slot"></span></h2></div>
    <div style="display:flex;align-items:center;gap:.5rem;padding:.9rem 1rem;color:var(--sub)"><span data-ic="lock" style="width:1rem;height:1rem;color:#fff"></span><small data-i="sysonly"></small></div>
    <div class="scroll" id="upd-list"></div>
  </div>

  <div class="page" id="p-add">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="addtitle"></h2></div>
    <div class="scroll">
      <input class="field" id="add-in" data-ip="add_ph" autocomplete="off" autocapitalize="off">
      <button class="btn" id="add-btn" onclick="retrouverAmi()" data-i="find"></button>
      <div class="err" id="add-err"></div>
    </div>
  </div>

  <div class="page" id="p-ami">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="profil"></h2></div>
    <div class="scroll" style="text-align:center">
      <div id="ami-av" style="display:flex;justify-content:center;margin:1.2rem 0"></div>
      <h2 id="ami-name" style="display:flex;justify-content:center;align-items:center"></h2>
      <button class="btn" id="ami-btn" data-i="talk"></button>
    </div>
  </div>

  <div class="page" id="chat">
    <div class="hd">
      <button class="ib back" onclick="goBack()" data-ic="back"></button>
      <span id="ch-av"></span>
      <h2 id="ch-name" style="font-size:1.05rem"></h2>
      <button class="ib" onclick="toggleDD(event)" data-ic="dots"></button>
    </div>
    <div id="dd"></div>
    <div id="msgs"></div>
    <div class="bar" id="reply-bar"><span id="reply-txt"></span><button onclick="cancelReply()" data-ic="close" style="width:1.4rem"></button></div>
    <div class="bar" id="blk-bar" style="justify-content:space-between"><span data-i="isblocked"></span><button onclick="deBloquerUtilisateur()" style="color:var(--acc)" data-i="unblock"></button></div>
    <div class="comp" id="comp">
      <button class="ib" onclick="$('chat-file').click()" data-ic="gallery"></button>
      <input type="file" accept="image/*" id="chat-file" hidden>
      <textarea id="inp" rows="1" data-ip="msg_ph"></textarea>
      <button class="ib send" onclick="envoyerMessage()" data-ic="send"></button>
    </div>
  </div>

  <div class="page" id="media">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="media"></h2></div>
    <div class="scroll"><div id="media-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem"></div></div>
  </div>

  <div class="page" id="parametres">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="param"></h2></div>
    <div class="scroll">
      <div class="acct">
        <div id="set-av" style="display:flex;justify-content:center"></div>
        <h2 id="set-name" style="margin:.8rem 0 .2rem;display:flex;justify-content:center;align-items:center"></h2>
        <div class="lk" id="set-link"></div>
        <button class="btn" onclick="copierLien()" data-i="copy"></button>
      </div>
      <div class="item" onclick="showPage('p-profil')"><span data-ic="user"></span><b data-i="profil"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="openTheme()"><span data-ic="palette"></span><b data-i="theme"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-acces')"><span data-ic="access"></span><b data-i="access"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-plus')"><span data-ic="info"></span><b data-i="more"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="openSuppr()"><span data-ic="trash"></span><b data-i="suppr"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-badge')"><span data-ic="badgeic"></span><b data-i="badge"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="openLien()"><span data-ic="link"></span><b data-i="lien"></b><span class="ch" data-ic="chev"></span></div>
    </div>
  </div>

  <div class="page" id="p-profil">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="profil"></h2></div>
    <div class="scroll" style="text-align:center">
      <div id="pf-av" style="display:flex;justify-content:center;margin:1rem 0"></div>
      <h2 id="pf-name" style="display:flex;justify-content:center;align-items:center"></h2>
      <p class="sub" data-i="lien"></p>
      <div class="field" id="pf-link" style="word-break:break-all;font-size:.85rem"></div>
      <button class="btn" onclick="copierLien()" data-i="copy"></button>
    </div>
  </div>

  <div class="page" id="p-acces">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="access"></h2></div>
    <div class="scroll">
      <h3 data-i="size"></h3>
      <div class="seg" id="size-seg">
        <button data-s="large" onclick="changerTailleTexte('large')" data-i="large"></button>
        <button data-s="small" onclick="changerTailleTexte('small')" data-i="small"></button>
        <button data-s="medium" onclick="changerTailleTexte('medium')" data-i="medium"></button>
      </div>
      <p class="sub" data-i="sample"></p>
      <h3 data-i="lang"></h3>
      <div id="lang-list"></div>
    </div>
  </div>

  <div class="page" id="p-plus">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="more"></h2></div>
    <div class="scroll">
      <div style="display:flex;justify-content:center;margin:1rem 0"><span class="av big" style="background:#0A0F1E;padding:1rem" data-ic="star"></span></div>
      <h2 style="text-align:center">Nova <small class="sub">v1.0</small></h2>
      <p data-i="about" style="line-height:1.6"></p>
    </div>
  </div>

  <div class="page" id="p-suppr">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="suppr"></h2></div>
    <div class="scroll">
      <div class="upd"><p style="margin:0;line-height:1.5" data-i="supprtxt"></p></div>
      <div id="suppr-list"></div>
      <button class="btn red" id="del-btn" onclick="supprimerDiscussion(0)" data-i="del"></button>
    </div>
  </div>

  <div class="page" id="p-badge">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="badge"></h2></div>
    <div class="scroll">
      <div class="item" onclick="ouvrirVerif()"><span data-ic="check"></span><b data-i="verif"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-cert')"><span data-ic="badgeic"></span><b data-i="certif"></b><span class="ch" data-ic="chev"></span></div>
    </div>
  </div>

  <div class="page" id="p-verif">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="verif"></h2></div>
    <div class="scroll"><p class="sub" data-i="weekact"></p><div id="verif-tab"></div></div>
  </div>

  <div class="page" id="p-cert">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="certif"></h2></div>
    <div class="scroll" style="text-align:center">
      <div style="margin:2rem 0" id="cert-bdg"></div>
      <div class="upd"><b data-i="bdesc"></b><p class="sub" data-i="bdesc2"></p></div>
      <div class="err" id="cert-msg" style="font-size:1rem"></div>
      <button class="btn" id="cert-btn" onclick="demanderBadge()" data-i="request"></button>
    </div>
  </div>

  <div class="page" id="p-lien">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="lien"></h2></div>
    <div class="scroll">
      <div class="field" id="lien-box" style="word-break:break-all;font-size:1.15rem;text-align:center;padding:1.6rem 1rem"></div>
      <button class="btn" onclick="copierLien()" data-i="copy"></button>
      <button class="btn ghost" onclick="envoyerLien()" data-i="share"></button>
    </div>
  </div>
</div>

function contactIds(){try{return JSON.parse(localStorage.getItem('nova_contacts')||'[]')}catch(e){return[]}}

async function getUsers(ids){
  const miss=ids.map(String).filter(i=>!userCache[i]);
  if(miss.length){const r=await supabaseClient.from('utilisateurs').select('*').in('id',miss);(r.data||[]).forEach(u=>userCache[String(u.id)]=u)}
  return ids.map(i=>userCache[String(i)]).filter(Boolean);
}

async function retrouverAmi(){
  const v=$('add-in').value.trim();const err=$('add-err');err.textContent='';
  const b=$('add-btn');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  const m=v.match(/^nova:\/\/user\?id=([^&\s]+)$/i);
  let u=null;
  const tasks=[sleep(2000)];
  if(m){tasks.push(supabaseClient.from('utilisateurs').select('*').eq('id',decodeURIComponent(m[1])).maybeSingle().then(r=>{u=r.data||null}).catch(()=>{}))}
  await Promise.all(tasks);
  b.disabled=false;b.textContent=t('find');
  if(!u){err.textContent=t('notfound');return}
  if(String(u.id)===String(me.id)){err.textContent=t('ownlink');return}

}

const officialUnread=()=>localStorage.getItem('nova_seen_version')!==(UPDATES[UPDATES.length-1]||{}).version;
function setDot(){$('dot').style.display=(unreadN>0||officialUnread())?'block':'none'}
async function refreshUnread(){
  const r=await supabaseClient.from('messages').select('id',{count:'exact',head:true}).eq('destinataire_id',me.id).neq('statut','lu').neq('texte','__block__').neq('bloque',true);
  unreadN=r.count||0;setDot();
}
async function chargerDiscussions(){
  if(!me)return;
  const r=await supabaseClient.from('messages').select('*').or(`expediteur_id.eq.${me.id},destinataire_id.eq.${me.id}`).order('date_envoi',{ascending:false}).limit(600);
  const map={};
  (r.data||[]).forEach(m=>{
    const mine=String(m.expediteur_id)===String(me.id);const o=String(mine?m.destinataire_id:m.expediteur_id);
    map[o]=map[o]||{last:null,unread:0};
    if(m.texte==='__block__'||(m.bloque&&!mine))return;
    if(!map[o].last)map[o].last=m;
    if(!mine&&m.statut!=='lu')map[o].unread++;
  });
  Object.keys(map).forEach(addContact);
  contactIds().forEach(c=>{map[c]=map[c]||{last:null,unread:0}});
  const users=await getUsers(Object.keys(map));
  users.sort((a,b)=>new Date((map[String(b.id)].last||{}).date_envoi||0)-new Date((map[String(a.id)].last||{}).date_envoi||0));
  const lastUpd=UPDATES[UPDATES.length-1]||{};
  let h=`<div class="conv" onclick="ouvrirNova()"><span class="av" style="background:#0A0F1E;padding:.45rem">${STAR}</span><div class="mid"><b>Nova ${BADGE}</b><span>${esc(lastUpd.titre||t('official'))}</span></div>${officialUnread()?'<i class="pt"></i>':''}</div>`;
  users.forEach(u=>{
    const x=map[String(u.id)];let pv='';
    if(x.last){const tx=parseTexte(x.last.texte).text;pv=(x.last.photo&&!tx)?'📷 Photo':tx}
    h+=`<div class="conv" onclick="ouvrirChat('${esc(u.id)}')">${av(u)}<div class="mid"><b>${nameHtml(u)}</b><span>${esc(pv)}</span></div>${x.unread?'<i class="pt"></i>':''}</div>`;
  });
  $('conv-list').innerHTML=h;
  unreadN=Object.values(map).reduce((a,x)=>a+x.unread,0);setDot();
}
function ouvrirNova(){
  const list=[...UPDATES].reverse();
  $('upd-list').innerHTML=list.map(u=>`<div class="upd"><b>${esc(u.titre)}</b> <small>v${esc(u.version)} · ${esc(u.date)}</small><p style="margin:.5rem 0 0;line-height:1.5">${esc(u.texte)}</p></div>`).join('')||'<p class="sub">—</p>';
  localStorage.setItem('nova_seen_version',(UPDATES[UPDATES.length-1]||{}).version||'');setDot();

      +(p.reply?`<div class="quote">${esc(p.reply)}</div>`:'')

      +(p.text?`<div>${esc(p.text)}</div>`:'')

    const id=delTarget;
    const res=await Promise.all([supabaseClient.from('messages').delete().or(`and(expediteur_id.eq.${me.id},destinataire_id.eq.${id}),and(expediteur_id.eq.${id},destinataire_id.eq.${me.id})`),sleep(rnd(3000,5000))]);
    closeSheet();toast(res[0].error?res[0].error.message:'✓');if(!res[0].error)delTarget=null;
  }
}

/* ===== Badges (5 utilisateurs max) ===== */
async function ouvrirVerif(){
  const since=new Date(Date.now()-7*864e5).toISOString();
  const res=await Promise.all([
    supabaseClient.from('messages').select('date_envoi').eq('expediteur_id',me.id).neq('texte','__block__').gte('date_envoi',since),
    supabaseClient.from('statuts').select('date_publication').eq('auteur_id',me.id).neq('texte','__badge__').gte('date_publication',since)]);
  const days=[];for(let i=6;i>=0;i--)days.push(new Date(Date.now()-i*864e5).toDateString());
  const cnt=(arr,k)=>days.map(d=>(arr||[]).filter(x=>new Date(x[k]).toDateString()===d).length);
  const m=cnt(res[0].data,'date_envoi'),s=cnt(res[1].data,'date_publication');
  $('verif-tab').innerHTML='<table><tr><th></th><th>💬</th><th>◎</th></tr>'+days.map((d,i)=>`<tr><td>${esc(new Date(d).toLocaleDateString([], {weekday:'short',day:'numeric'}))}</td><td>${m[i]}</td><td>${s[i]}</td></tr>`).join('')+`<tr><th>Total</th><th>${m.reduce((x,y)=>x+y,0)}</th><th>${s.reduce((x,y)=>x+y,0)}</th></tr></table>`;
  showPage('p-verif');
}
async function demanderBadge(){
  const b=$('cert-btn'),msg=$('cert-msg');msg.textContent='';
  if(badgeSet.has(String(me.id))){msg.style.color='#22C55E';msg.textContent='✓';return}
  b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{
    const res=await Promise.all([supabaseClient.from('statuts').select('id',{count:'exact',head:true}).eq('texte','__badge__'),sleep(rnd(5000,8000))]);
    const c=res[0];if(c.error)throw c.error;
    if((c.count||0)<5){
      const r=await supabaseClient.from('statuts').insert({auteur_id:me.id,photo:null,texte:'__badge__',legende:'badge',date_publication:new Date().toISOString()});
      if(r.error)throw r.error;
      badgeSet.add(String(me.id));msg.style.color='#22C55E';msg.textContent='✓';renderSettings();
    }else throw new Error('full');
  }catch(e){msg.style.color='#F87171';msg.textContent='Demande non soumise, veuillez réessayer ou signaler.'}
  b.disabled=false;b.textContent=t('request');
}

/* ===== Temps réel ===== */
function subscribe(){
  supabaseClient.channel('messages').on('postgres_changes',{event:'*',schema:'public',table:'messages'},p=>{
    const r=(p.new&&Object.keys(p.new).length)?p.new:(p.old||{});
    const rel=p.eventType==='DELETE'||String(r.expediteur_id)===String(me.id)||String(r.destinataire_id)===String(me.id);
    if(!rel)return;
    refreshUnread();
    if(currentPage==='discussions')chargerDiscussions();
    if(cur&&currentPage==='chat')chargerMessages().then(marquerLu);
  }).subscribe();
  typingCh=supabaseClient.channel('nova-typing').on('broadcast',{event:'typing'},({payload})=>{
    if(!cur||payload.to!==String(me.id)||payload.from!==String(cur.id))return;
    typingOn=true;const e=$('typing');if(e){e.style.display='flex';$('msgs').scrollTop=$('msgs').scrollHeight}
    clearTimeout(typingTimer);typingTimer=setTimeout(()=>{typingOn=false;const x=$('typing');if(x)x.style.display='none'},3000);
  }).subscribe();
}

/* ===== Démarrage ===== */
function initApp(){
  subscribe();loadBadges().then(()=>{if(currentPage==='discussions')chargerDiscussions()});
  stack=[];showPage('discussions');
}
function boot(){
  applyTheme();applyLang();icons();
  document.querySelectorAll('#nav [data-ic]').forEach(e=>{e.innerHTML=icon(e.dataset.ic,2.5)});
  changerTailleTexte(localStorage.getItem('nova_size')||'medium');
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  setTimeout(()=>{
    const id=localStorage.getItem('nova_user_id');
    if(id){me={id:id,nom:localStorage.getItem('nova_user_nom'),photo:localStorage.getItem('nova_user_photo')||null,lien:localStorage.getItem('nova_user_lien')||('nova://user?id='+id)};initApp()}
    else showPage('inscription');
  },rnd(3000,5000));
}
boot();
</script>
