<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova</title>
<style>
:root{--bg:#04060c;--bg2:#0b1530;--card:#0f1a38;--tx:#f2f6ff;--sub:#8fa0c8;--blue:#2563eb;--line:#1a2750;--chatbg:linear-gradient(180deg,#071027,#050a1a)}
[data-theme=light]{--bg:#eef2fb;--bg2:#ffffff;--card:#ffffff;--tx:#0b1226;--sub:#5b6a8f;--line:#d9e1f3;--chatbg:linear-gradient(180deg,#dfe7fa,#eef2fb)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,16px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);color:var(--tx)}
.page.on{display:flex;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:.7rem;padding:calc(env(safe-area-inset-top) + .8rem) 1rem .9rem;background:linear-gradient(135deg,#0a1a4d,#050b24);color:#fff;border-radius:0 0 22px 22px;flex-shrink:0}
.hd h2{margin:0;font-size:1.2rem;flex:1}
.ib{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.ib:active{background:rgba(255,255,255,.15)}
svg{width:1.4rem;height:1.4rem;display:block}
.scroll{flex:1;overflow:auto;padding:1rem;padding-bottom:6rem}
.av{width:2.8rem;height:2.8rem;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.av.big{width:6rem;height:6rem;font-size:2.2rem}
.av.sm{width:2.3rem;height:2.3rem}
.bdg{width:16px!important;height:16px!important;display:inline-block!important;vertical-align:-2px;margin-left:3px}
.item{display:flex;align-items:center;gap:.9rem;padding:1.05rem 1rem;margin-bottom:.8rem;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.98)}
.item b{flex:1;font-weight:600}
.item .ic{color:var(--blue)}
.item .ch{color:var(--sub)}
.item svg{width:1.3rem;height:1.3rem}
.btn{display:block;width:100%;padding:1rem;border-radius:18px;background:var(--blue);color:#fff;font-weight:700;text-align:center;margin-top:.8rem}
.btn.red{background:#dc2626}.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.7}
.field{width:100%;padding:1rem 1.1rem;border-radius:18px;border:1px solid var(--line);background:var(--card);outline:none}
.field:focus{border-color:var(--blue)}
.spin{display:inline-block;width:1.3rem;height:1.3rem;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
.sub{color:var(--sub);font-size:.85rem}
.err{color:#f87171;min-height:1.2rem;font-size:.9rem;text-align:center;margin-top:.5rem}
/* splash */
#splash{background:radial-gradient(circle at 50% 45%,#0b1a4d,#02040a 70%);align-items:center;justify-content:center}
#splash svg{width:7.5rem;height:7.5rem;animation:pulse 2s ease-in-out infinite;filter:drop-shadow(0 0 22px #7c3aed)}
@keyframes pulse{50%{transform:scale(1.08)}}
/* inscription */
#inscription .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;gap:1.2rem}
.photo-pick{width:8rem;height:8rem;border-radius:50%;background:var(--card);border:2px dashed var(--blue);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--blue)}
.photo-pick img{width:100%;height:100%;object-fit:cover}
/* nav */
#nav{position:fixed;left:.7rem;right:.7rem;bottom:calc(env(safe-area-inset-bottom) + .6rem);height:4rem;background:linear-gradient(135deg,#0a1a4d,#050b24);border-radius:28px;display:none;justify-content:space-around;align-items:center;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#nav button{color:rgba(255,255,255,.55);width:5rem;height:3rem;border-radius:20px;display:grid;place-items:center;position:relative;transition:.2s}
#nav button.act{color:#fff;background:rgba(37,99,235,.45)}
#dot{position:absolute;top:.5rem;right:1.3rem;width:.65rem;height:.65rem;border-radius:50%;background:#3b82f6;border:2px solid #0a1a4d;display:none}
/* list */
.conv{display:flex;align-items:center;gap:.8rem;padding:.85rem;margin-bottom:.55rem;background:var(--card);border-radius:20px;cursor:pointer;border:1px solid var(--line)}
.conv .mid{flex:1;min-width:0}
.conv .mid b{display:block}
.conv .mid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub);font-size:.85rem}
.pt{width:.7rem;height:.7rem;border-radius:50%;background:#3b82f6}
/* chat */
#chat{background:var(--chatbg)}
#msgs{flex:1;overflow:auto;padding:1rem .8rem;display:flex;flex-direction:column;gap:.35rem}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}.row.ot{align-self:flex-start}
.bub{position:relative;padding:.6rem .9rem;border-radius:20px;color:#fff;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;user-select:none;-webkit-user-select:none;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.me .bub{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-bottom-right-radius:6px}
.ot .bub{background:#000;border:1px solid #1b2547;border-bottom-left-radius:6px}
.bub .meta{font-size:.65rem;opacity:.7;text-align:right;margin-top:.2rem}
.mimg{max-width:100%;border-radius:14px;display:block;margin-bottom:.3rem}
.quote{border-left:3px solid #93c5fd;background:rgba(255,255,255,.12);padding:.3rem .5rem;border-radius:8px;font-size:.8rem;margin-bottom:.35rem;opacity:.9}
.react{position:absolute;bottom:-.8rem;right:.5rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 .3rem;font-size:.85rem}
.row:has(.react){margin-bottom:.6rem}
.st{font-size:.65rem;color:var(--sub);margin:.15rem .4rem 0}
.day{align-self:center;font-size:.7rem;color:var(--sub);background:var(--card);padding:.2rem .7rem;border-radius:12px;margin:.4rem 0}
.dots{display:flex;gap:.25rem;padding:.8rem .9rem}
.dots i{width:.5rem;height:.5rem;background:#93c5fd;border-radius:50%;animation:jump 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes jump{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.comp{display:flex;align-items:flex-end;gap:.5rem;padding:.6rem .7rem calc(env(safe-area-inset-bottom) + .6rem);background:var(--bg2);border-radius:22px 22px 0 0;flex-shrink:0}
.comp textarea{flex:1;resize:none;max-height:7rem;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:.7rem 1rem;outline:none;caret-color:#3b82f6;height:2.8rem}
.comp .ib{color:var(--tx);height:2.8rem;width:2.8rem}
.comp .send{background:var(--blue);color:#fff}
.bar{display:none;align-items:center;gap:.6rem;padding:.5rem .9rem;background:var(--bg2);border-left:4px solid var(--blue);font-size:.85rem;color:var(--sub)}
.bar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar button{color:var(--tx)}
#dd{position:absolute;top:4.2rem;right:.8rem;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:.5rem;min-width:13rem;display:none;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4);color:var(--tx)}
#dd .top{display:flex;gap:.6rem;align-items:center;padding:.6rem;border-bottom:1px solid var(--line);margin-bottom:.3rem}
#dd button{display:flex;align-items:center;gap:.7rem;width:100%;padding:.7rem;border-radius:14px;text-align:left}
#dd button:active{background:var(--line)}
#dd svg{width:1.2rem;height:1.2rem;color:var(--blue)}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet{width:100%;max-width:30rem;background:var(--bg2);color:var(--tx);border-radius:28px 28px 0 0;padding:1.2rem 1.2rem calc(env(safe-area-inset-bottom) + 1.2rem);animation:up .25s ease;max-height:85vh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#sheet h3{margin:.2rem 0 .6rem}
.emo{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:.8rem}
.emo button{font-size:1.7rem;padding:.3rem;border-radius:14px}.emo button:active{background:var(--line)}
.act-b{display:block;width:100%;text-align:left;padding:.85rem 1rem;border-radius:16px;background:var(--card);margin-top:.4rem;border:1px solid var(--line)}
.seg{display:flex;gap:.5rem;margin:.6rem 0}
.seg button{flex:1;padding:.8rem;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.seg button.sel,.lang.sel{border-color:var(--blue);background:rgba(37,99,235,.25)}
.lang{display:flex;gap:.8rem;align-items:center;padding:.8rem 1rem;border-radius:16px;background:var(--card);margin-bottom:.45rem;border:1px solid var(--line);width:100%;text-align:left}
.lang .fl{font-size:1.5rem}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden}
td,th{padding:.7rem;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600;font-size:.8rem}
/* statuts */
.bigplus{width:5.5rem;height:5.5rem;border-radius:50%;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;display:grid;place-items:center;margin:.5rem auto;box-shadow:0 8px 28px rgba(37,99,235,.5)}
.bigplus svg{width:2.6rem;height:2.6rem}
.ring{padding:3px;border-radius:50%;background:#3b82f6}.ring.seen{background:#4b5563}.ring .av{border:2px solid var(--card)}
.sv{position:fixed;inset:0;background:#000;color:#fff;z-index:60;display:none;flex-direction:column}
.sv .prog{display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + .6rem) .8rem .3rem}
.sv .prog i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.sv .prog i b{display:block;height:100%;width:0;background:#fff}
.sv .stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
.sv .stage img{max-width:100%;max-height:100%}
.tbg{position:absolute;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;font-size:1.6rem;font-weight:700}
.tbg svg.decor{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.tbg span,.tbg textarea{position:relative}
.tbg textarea{background:none;border:0;outline:none;color:#fff;text-align:center;font-size:1.6rem;font-weight:700;width:100%;height:60%;resize:none}
.cap{position:absolute;bottom:0;left:0;right:0;padding:1rem;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:center}
.toast{position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%);background:#111c3d;color:#fff;padding:.7rem 1.2rem;border-radius:20px;z-index:99;display:none;max-width:85%;text-align:center;font-size:.9rem}
.upd{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1rem;margin-bottom:.8rem}
.upd small{color:var(--sub)}
html[dir=rtl] .back svg,html[dir=rtl] .ch svg{transform:scaleX(-1)}
</style>
</head>
<body>

<div id="app">
  <!-- SPLASH -->
  <div class="page on" id="splash"><span data-ic="star"></span></div>

  <!-- INSCRIPTION -->
  <div class="page" id="inscription">
    <div class="hd"><h2 style="text-align:center" data-i="signup"></h2></div>
    <div class="body">
      <label class="photo-pick" id="reg-pp"><span data-ic="gallery"></span><input type="file" accept="image/*" id="reg-file" hidden></label>
      <input class="field" id="reg-nom" maxlength="30" data-ip="name_ph" autocomplete="off">
      <div class="err" id="reg-err"></div>
    </div>
    <div style="padding:1rem 1.2rem calc(env(safe-area-inset-bottom) + 1.2rem)"><button class="btn" id="reg-btn" onclick="creerCompte()" data-i="create"></button></div>
  </div>

  <!-- DISCUSSIONS -->
  <div class="page" id="discussions">
    <div class="hd"><button class="ib" onclick="showPage('parametres')" data-ic="gear"></button><h2 data-i="disc"></h2></div>
    <div class="scroll" id="conv-list"></div>
  </div>

  <!-- STATUTS -->
  <div class="page" id="statuts">
    <div class="hd"><button class="ib" onclick="showPage('parametres')" data-ic="gear"></button><h2 data-i="stat"></h2><button class="ib" onclick="openStatutTexte()" data-ic="text"></button></div>
    <div class="scroll">
      <button class="bigplus" onclick="$('st-file').click()" data-ic="plus"></button>
      <input type="file" accept="image/*" id="st-file" hidden>
      <div id="st-list" style="margin-top:1rem"></div>
    </div>
  </div>

  <!-- NOUVEAU STATUT -->
  <div class="page" id="st-new">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="newstatus"></h2></div>
    <div id="st-prev" style="flex:1;position:relative;overflow:hidden"></div>
    <div class="comp" id="st-foot">
      <textarea id="st-cap" rows="1" data-ip="caption"></textarea>
      <button class="ib send" id="st-share" onclick="publierStatut()" data-ic="send"></button>
    </div>
  </div>

  <!-- NOVA OFFICIEL -->
  <div class="page" id="nova">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><span class="av sm" style="background:#050b24" data-ic="star"></span><h2>Nova <span class="bdg-slot"></span></h2></div>
    <div style="display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;color:var(--sub)"><span data-ic="lock" style="color:#fff;background:var(--blue);border-radius:50%;padding:.35rem;display:grid"></span><small data-i="sysonly"></small></div>
    <div class="scroll" id="upd-list"></div>
  </div>

  <!-- CHAT -->
  <div class="page" id="chat">
    <div class="hd">
      <button class="ib back" onclick="goBack()" data-ic="back"></button>
      <span id="ch-av"></span>
      <h2 id="ch-name" style="font-size:1.05rem"></h2>
      <button class="ib" onclick="toggleDD(event)" data-ic="dots"></button>
    </div>
    <div id="dd"></div>
    <div id="msgs"></div>
    <div class="bar" id="reply-bar"><span id="reply-txt"></span><button onclick="cancelReply()" data-ic="close"></button></div>
    <div class="bar" id="blk-bar" style="justify-content:space-between"><span data-i="isblocked"></span><button onclick="deBloquerUtilisateur()" style="color:#60a5fa" data-i="unblock"></button></div>
    <div class="comp" id="comp">
      <button class="ib" onclick="$('chat-file').click()" data-ic="gallery"></button>
      <input type="file" accept="image/*" id="chat-file" hidden>
      <textarea id="inp" rows="1" data-ip="msg_ph"></textarea>
      <button class="ib send" onclick="envoyerMessage()" data-ic="send"></button>
    </div>
  </div>

  <!-- MEDIA -->
  <div class="page" id="media">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="media"></h2></div>
    <div class="scroll"><div id="media-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem"></div></div>
  </div>

  <!-- PARAMETRES -->
  <div class="page" id="parametres">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><span data-ic="gear"></span><h2 data-i="param"></h2></div>
    <div class="scroll">
      <div class="item" style="margin-bottom:1.1rem" onclick="showPage('p-profil')"><span id="set-av"></span><b id="set-name"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="openTheme()"><span class="ic" data-ic="palette"></span><b data-i="theme"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-acces')"><span class="ic" data-ic="access"></span><b data-i="access"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-plus')"><span class="ic" data-ic="info"></span><b data-i="more"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="openSuppr()"><span class="ic" data-ic="trash"></span><b data-i="suppr"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-badge')"><span class="ic" data-ic="badgeic"></span><b data-i="badge"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="openLien()"><span class="ic" data-ic="link"></span><b data-i="lien"></b><span class="ch" data-ic="chev"></span></div>
    </div>
  </div>

  <!-- Sous-pages -->
  <div class="page" id="p-profil">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="profil"></h2></div>
    <div class="scroll" style="text-align:center">
      <div id="pf-av" style="display:flex;justify-content:center;margin:1rem 0"></div>
      <h2 id="pf-name"></h2>
      <p class="sub" data-i="lien"></p>
      <div class="field" id="pf-link" style="word-break:break-all;font-size:.85rem"></div>
      <button class="btn" onclick="copierLien()" data-i="copy"></button>
    </div>
  </div>

  <div class="page" id="p-acces">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="access"></h2></div>
    <div class="scroll">
      <h3 data-i="size"></h3>
      <div class="seg" id="size-seg">
        <button data-s="large" onclick="changerTailleTexte('large')" data-i="large"></button>
        <button data-s="medium" onclick="changerTailleTexte('medium')" data-i="medium"></button>
        <button data-s="small" onclick="changerTailleTexte('small')" data-i="small"></button>
      </div>
      <p class="sub" data-i="sample"></p>
      <h3 data-i="lang"></h3>
      <div id="lang-list"></div>
    </div>
  </div>

  <div class="page" id="p-plus">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="more"></h2></div>
    <div class="scroll"><div style="text-align:center;margin:1rem 0"><span class="av big" style="background:#050b24;margin:auto;filter:drop-shadow(0 0 12px #7c3aed)" data-ic="star"></span></div>
      <h2 style="text-align:center">Nova <small class="sub">v1.0</small></h2>
      <p data-i="about" style="line-height:1.6"></p></div>
  </div>

  <div class="page" id="p-suppr">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="suppr"></h2></div>
    <div class="scroll">
      <div class="upd"><p style="margin:0;line-height:1.5" data-i="supprtxt"></p></div>
      <div id="suppr-list"></div>
      <button class="btn red" id="del-btn" onclick="supprimerDiscussion(0)" data-i="del"></button>
    </div>
  </div>

  <div class="page" id="p-badge">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="badge"></h2></div>
    <div class="scroll">
      <div class="item" onclick="ouvrirVerif()"><span class="ic" data-ic="check"></span><b data-i="verif"></b><span class="ch" data-ic="chev"></span></div>
      <div class="item" onclick="showPage('p-cert')"><span class="ic" data-ic="badgeic"></span><b data-i="certif"></b><span class="ch" data-ic="chev"></span></div>
    </div>
  </div>

  <div class="page" id="p-verif">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="verif"></h2></div>
    <div class="scroll"><p class="sub" data-i="weekact"></p><div id="verif-tab"></div></div>
  </div>

  <div class="page" id="p-cert">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="certif"></h2></div>
    <div class="scroll" style="text-align:center">
      <div style="margin:1.2rem 0" id="cert-bdg"></div>
      <div class="upd"><b data-i="bdesc"></b><p class="sub" data-i="bdesc2"></p></div>
      <div class="err" id="cert-msg" style="font-size:1rem"></div>
      <button class="btn" id="cert-btn" onclick="demanderBadge()" data-i="request"></button>
    </div>
  </div>

  <div class="page" id="p-lien">
    <div class="hd"><button class="ib back" onclick="goBack()" data-ic="back"></button><h2 data-i="lien"></h2></div>
    <div class="scroll">
      <div class="field" id="lien-box" style="word-break:break-all"></div>
      <button class="btn" onclick="copierLien()" data-i="copy"></button>
      <button class="btn ghost" onclick="envoyerLien()" data-i="share"></button>
    </div>
  </div>
</div>

<nav id="nav">
  <button data-go="discussions" onclick="showPage('discussions')"><span data-ic="chat"></span><span id="dot"></span></button>
  <button data-go="statuts" onclick="showPage('statuts')"><span data-ic="user"></span></button>
</nav>

<div class="sv" id="sv"></div>
<div id="ov" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- update.official.js (optionnel, à côté de index.html) -->
<script src="update.official.js" onerror="void 0"></script>

const SUPABASE_URL = "https://casmvccycoznwnuqlbca.supabase.co";

function contactIds(){try{return JSON.parse(localStorage.getItem('nova_contacts')||'[]')}catch(e){return[]}}
function addContact(id){id=String(id);if(id===String(me.id))return;const c=contactIds();if(!c.includes(id)){c.push(id);localStorage.setItem('nova_contacts',JSON.stringify(c))}}
async function getUsers(ids){
  const miss=ids.map(String).filter(i=>!userCache[i]);
  if(miss.length){const {data}=await supabaseClient.from('utilisateurs').select('*').in('id',miss);(data||[]).forEach(u=>userCache[String(u.id)]=u)}
  return ids.map(i=>userCache[String(i)]).filter(Boolean);
}

/* ===== Discussions ===== */
const officialUnread=()=>localStorage.getItem('nova_seen_version')!==(UPDATES[UPDATES.length-1]||{}).version;
function setDot(){$('dot').style.display=(unreadN>0||officialUnread())?'block':'none'}
async function refreshUnread(){
  const {count}=await supabaseClient.from('messages').select('id',{count:'exact',head:true}).eq('destinataire_id',me.id).neq('statut','lu').neq('texte','__block__').neq('bloque',true);
  unreadN=count||0;setDot();
}
async function chargerDiscussions(){
  if(!me)return;
  const {data}=await supabaseClient.from('messages').select('*').or(`expediteur_id.eq.${me.id},destinataire_id.eq.${me.id}`).order('date_envoi',{ascending:false}).limit(600);
  const map={};
  (data||[]).forEach(m=>{
    const mine=String(m.expediteur_id)===String(me.id);const o=String(mine?m.destinataire_id:m.expediteur_id);
    map[o]=map[o]||{last:null,unread:0};
    if(m.texte==='__block__'||(m.bloque&&!mine))return;
    if(!map[o].last)map[o].last=m;
    if(!mine&&m.statut!=='lu')map[o].unread++;
  });
  contactIds().forEach(c=>{map[c]=map[c]||{last:null,unread:0}});
  const ids=Object.keys(map);const users=await getUsers(ids);
  users.sort((a,b)=>new Date((map[String(b.id)].last||{}).date_envoi||0)-new Date((map[String(a.id)].last||{}).date_envoi||0));
  const lastUpd=UPDATES[UPDATES.length-1]||{};
  let h=`<div class="conv" onclick="ouvrirNova()"><span class="av" style="background:#050b24">${STAR}</span><div class="mid"><b>Nova ${BADGE}</b><span>${esc(lastUpd.titre||t('official'))}</span></div>${officialUnread()?'<i class="pt"></i>':''}</div>`;
  users.forEach(u=>{
    const x=map[String(u.id)];let pv='';
    if(x.last){const {text}=parseTexte(x.last.texte);pv=(String(x.last.expediteur_id)===String(me.id)?'':'')+(x.last.photo&&!text?'📷 Photo':text)}
    h+=`<div class="conv" onclick="ouvrirChat('${u.id}')">${av(u)}<div class="mid"><b>${nameHtml(u)}</b><span>${esc(pv)}</span></div>${x.unread?'<i class="pt"></i>':''}</div>`;
  });
  $('conv-list').innerHTML=h;icons($('conv-list'));
  unreadN=Object.values(map).reduce((a,x)=>a+x.unread,0);setDot();
}
function ouvrirNova(){
  const list=[...UPDATES].reverse();
  $('upd-list').innerHTML=list.map(u=>`<div class="upd"><b>${esc(u.titre)}</b> <small>v${esc(u.version)} · ${esc(u.date)}</small><p style="margin:.5rem 0 0;line-height:1.5">${esc(u.texte)}</p></div>`).join('')||'<p class="sub">—</p>';
  localStorage.setItem('nova_seen_version',(UPDATES[UPDATES.length-1]||{}).version||'');setDot();
  showPage('nova');
}

function parseTexte(raw){const m=String(raw||'').match(/^⟦r:([\s\S]*?)⟧([\s\S]*)$/);return m?{reply:m[1],text:m[2]}:{reply:null,text:String(raw||'')}}

const findMsg=id=>msgs.find(m=>String(m.id)===String(id));
async function ouvrirChat(id){
  const [u]=await getUsers([String(id)]);if(!u){toast('Introuvable');return}
  cur=u;addContact(u.id);replyTo=null;editing=null;msgs=[];
  $('reply-bar').style.display='none';$('inp').value='';
  $('ch-av').innerHTML=av(u,'sm');$('ch-name').innerHTML=nameHtml(u);
  showPage('chat');await chargerMessages(true);marquerLu();
}
async function chargerMessages(scroll){
  if(!cur)return;
  const {data,error}=await supabaseClient.from('messages').select('*').or(`and(expediteur_id.eq.${me.id},destinataire_id.eq.${cur.id}),and(expediteur_id.eq.${cur.id},destinataire_id.eq.${me.id})`).order('date_envoi',{ascending:true}).limit(500);
  if(error){toast(error.message);return}
  const tmps=msgs.filter(m=>String(m.id).startsWith('tmp')&&m.statut==='echec');
  msgs=(data||[]).concat(tmps);
  blockedByMe=msgs.some(m=>m.texte==='__block__'&&m.bloque&&String(m.expediteur_id)===String(me.id));
  blockedByOther=msgs.some(m=>m.texte==='__block__'&&m.bloque&&String(m.expediteur_id)===String(cur.id));
  $('blk-bar').style.display=blockedByMe?'flex':'none';$('comp').style.display=blockedByMe?'none':'flex';
  renderMessages(scroll);
}
function renderMessages(scroll){
  const box=$('msgs');const near=box.scrollHeight-box.scrollTop-box.clientHeight<140;
  let h='',last='';
  msgs.forEach(m=>{
    if(m.texte==='__block__')return;

async function chargerStatuts(){
  const since=new Date(Date.now()-864e5).toISOString();
  const {data}=await supabaseClient.from('statuts').select('*').gte('date_publication',since).order('date_publication',{ascending:true});
  const friends=new Set(contactIds().concat([String(me.id)]));groups={};
  (data||[]).forEach(s=>{
    if(s.texte==='__badge__')return;
    if(Date.now()-new Date(s.date_publication)>=864e5)return;
    const a=String(s.auteur_id);if(!friends.has(a))return;(groups[a]=groups[a]||[]).push(s);
  });
  const ids=Object.keys(groups);const users=await getUsers(ids.filter(i=>i!==String(me.id)));
  const meU={id:me.id,nom:me.nom,photo_profil:me.photo};
  const row=(u,a,label)=>{
    const g=groups[a];const seen=a===String(me.id)||g.every(s=>parseArr(s.vu_par).map(String).includes(String(me.id)));
    return `<div class="conv" onclick="voirStatut('${a}',0)"><div class="ring ${seen?'seen':''}">${av(u)}</div><div class="mid"><b>${label||nameHtml(u)}</b><span>${heure(g[g.length-1].date_publication)}</span></div></div>`;
  };
  let h='';
  if(groups[String(me.id)])h+=row(meU,String(me.id),'Moi');
  users.forEach(u=>{h+=row(u,String(u.id))});
  $('st-list').innerHTML=h||'<p class="sub" style="text-align:center">—</p>';
}

    }else throw new Error('full');
  }catch(e){msg.style.color='#f87171';msg.textContent='Demande non soumise, veuillez réessayer ou signaler.'}
  b.disabled=false;b.textContent=t('request');
}

/* ===== Temps réel ===== */
function subscribe(){
  supabaseClient.channel('messages').on('postgres_changes',{event:'*',schema:'public',table:'messages'},p=>{
    const r=(p.new&&Object.keys(p.new).length)?p.new:(p.old||{});
    const rel=p.eventType==='DELETE'||String(r.expediteur_id)===String(me.id)||String(r.destinataire_id)===String(me.id);
    if(!rel)return;
    refreshUnread();
    if(currentPage==='discussions')chargerDiscussions();
    if(cur&&currentPage==='chat')chargerMessages().then(marquerLu);
  }).subscribe();
  typingCh=supabaseClient.channel('nova-typing').on('broadcast',{event:'typing'},({payload})=>{
    if(!cur||payload.to!==String(me.id)||payload.from!==String(cur.id))return;
    typingOn=true;const e=$('typing');if(e){e.style.display='flex';$('msgs').scrollTop=$('msgs').scrollHeight}
    clearTimeout(typingTimer);typingTimer=setTimeout(()=>{typingOn=false;const x=$('typing');if(x)x.style.display='none'},3000);
  }).subscribe();
}

/* ===== Démarrage ===== */
async function initApp(){
  subscribe();loadBadges().then(()=>{if(currentPage==='discussions')chargerDiscussions()});
  showPage('discussions');
  const p=new URLSearchParams(location.search).get('u');
  if(p&&String(p)!==String(me.id)){history.replaceState(null,'',location.href.split('?')[0]);addContact(p);await ouvrirChat(p)}
}
function boot(){
  applyTheme();applyLang();icons();
  changerTailleTexte(localStorage.getItem('nova_size')||'medium');
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  setTimeout(()=>{
    const id=localStorage.getItem('nova_user_id');
    if(id){me={id,nom:localStorage.getItem('nova_user_nom'),photo:localStorage.getItem('nova_user_photo')||null,lien:localStorage.getItem('nova_user_lien')};initApp()}
    else showPage('inscription');
  },rnd(3000,5000));
}
boot();
</script>
